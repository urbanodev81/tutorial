name: testes

on:
    push:
        branches: [main]
    pull_request:

jobs:
    testes:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: npm
            - run: npm ci
            - run: npm test
            # A demonstração usa o pacote pela fonte: se ela não compila, o
            # pacote quebrou para quem instala.
            - run: npm run demo:build
